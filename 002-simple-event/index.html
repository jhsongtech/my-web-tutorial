<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Simple Event</title>
  </head>
  <body>
    <button id="clickButton" type="button" onclick="handleButtonClick()">
      나를 클릭해 봐!
    </button>

    <br />

    <div id="todoContainer">
      <input id="todoInput" type="text" />
      <button id="addTodoButton" type="button" onclick="handleAddTodoClick()">
        투두 버튼 클릭해봐!
      </button>
    </div>

    <ul id="todoList"></ul>

    <script src="script.js"></script>
  </body>
</html>
