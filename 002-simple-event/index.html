<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Event</title>
  </head>
  <body>
    <button id="clickButton" type="button" onclick="handleButtonClick()">
      나를 클릭해 봐!
    </button>

    <br />

    <input id="todoInput" type="text" />
    <button id="addTodoButton" type="button" onclick="handleAddTodoClick()">
      투두 버튼 클릭해봐!
    </button>

    <ul id="todoList"></ul>

    <script>
      function handleButtonClick() {
        console.log("클릭");
        alert("안녕");
      }

      function handleAddTodoClick() {
        const todoText = document.getElementById("todoInput").value;

        // 요구사항 4
        alert(todoText);

        // 요구사항 5
        const ulList = document.querySelector("#todoList");
        const todoItem = document.createElement("li");
        todoItem.textContent = todoText;
        ulList.append(todoItem);
      }
    </script>
  </body>
</html>
