<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘의 할 일</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="todo-container">
      <form>
        <input
          type="text"
          id="todo-input"
          placeholder="할 일을 입력하세요..."
        />
        <button>추가</button>
      </form>

      <div>
        <input type="checkbox" id="todo1" />
        <label for="todo1">HTML 복습하기</label>
        <button class="todo-delete">삭제</button>
      </div>

      <div>
        <input type="checkbox" id="todo2" />
        <label for="todo2">운동하기</label>
        <button class="todo-delete">삭제</button>
      </div>

      <div>
        <input type="checkbox" id="todo3" />
        <label for="todo3">HTML 복습하기</label>
        <button class="todo-delete">삭제</button>
      </div>

      <div>
        <p>남은 할 일: <span id="todo-count">3</span>개</p>
      </div>
    </div>
  </body>
</html>
